name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Start the local stack
        run: |
          cp .env.example .env
          pnpm stack:up
      - name: Test
        run: pnpm test
      - name: Show stack logs on failure
        if: failure() && hashFiles('.env') != ''
        run: docker compose logs
      - name: Stop the local stack
        if: always() && hashFiles('.env') != ''
        run: pnpm stack:down

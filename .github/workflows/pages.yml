# Publishes the HTML mockups in docs/design/mockups and the interactive architecture
# diagrams in docs/architecture to GitHub Pages, so they can be opened as a link
# instead of read as source on GitHub.
name: Project site

on:
  push:
    branches: [main]
    paths:
      - "docs/design/mockups/**"
      - "docs/design/site/**"
      - "docs/architecture/*.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/mockups _site/architecture
          cp docs/design/mockups/*.html _site/mockups/
          cp docs/architecture/*.html _site/architecture/
          cp docs/design/site/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

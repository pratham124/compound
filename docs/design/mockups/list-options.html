<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compound: List options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&display=swap" rel="stylesheet">
<style>
/* ---------- Page chrome (px, so Larger text only affects the components) ---------- */
*{box-sizing:border-box}
html{font-size:17px}
html.larger{font-size:22.1px}
body{margin:0;background:#D9DBDF;color:#1B2230;font:16px/1.45 Nunito,system-ui,sans-serif}
.page{padding:32px;max-width:1360px;margin:0 auto}
.page-h h1{margin:0 0 6px;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.page-h p{margin:0 0 18px;font-size:16px;color:#3C4452}
.controls{margin-bottom:28px}
.tog{font:inherit;font-size:14px;font-weight:600;border:0;background:#C6C9CF;color:#1B2230;padding:9px 18px;border-radius:999px;cursor:pointer;min-height:44px}
.tog[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tog:focus-visible{outline:2px solid #1B2230;outline-offset:2px}
.cols{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.opt{flex:none;width:393px;margin:0;display:flex;flex-direction:column;gap:16px}
.opt > h2{margin:0;font-size:18px;line-height:1.3;font-weight:700;color:#1B2230}
.panel{width:393px;padding:16px;border-radius:24px;background:var(--bg);display:flex;flex-direction:column;gap:16px}

/* ---------- Tokens (copied from index.html: Friendly) ---------- */
.dir-friendly{--font:ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;--display-font:Fraunces,Georgia,serif;--r-card:24px;
  font-family:var(--font);font-size:1rem;line-height:1.2941;color:var(--label);-webkit-font-smoothing:antialiased}
.dir-friendly.light{--bg:#EDF3F0;--card:#FFFFFF;--label:#1E2B27;--secondary:#566A62;--sep:#E1EAE6;--sep-strong:#C5D3CD;--accent:#276F5D;--on-accent:#FFFFFF;--accent-soft:#DDF0E9;--char:#FAD4DC;--char-edge:#E09AAB;--warm:#F5DD8C}
.dir-friendly.dark{--bg:#191614;--card:#24201D;--label:#F5EFEA;--secondary:#B3A89F;--sep:#332D29;--sep-strong:#453D38;--accent:#8FD3BD;--on-accent:#10221C;--accent-soft:#24302B;--char:#F0BCC7;--char-edge:#C7808F;--warm:#E6CB7A;--mw:25%;--mc:30%}
.dir-friendly *{box-sizing:border-box}
.t-head{font-size:1rem;line-height:1.2941rem;font-weight:600}
.t-body{font-size:1rem;line-height:1.2941rem}
.t-sub{font-size:.8824rem;line-height:1.1765rem}
.t-foot{font-size:.7647rem;line-height:1.0588rem}
.t-cap{font-size:.7059rem;line-height:.9412rem}
.sec{color:var(--secondary)}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--display-font);font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
.grp{background:var(--card);border-radius:var(--r-card)}
.gh{margin:0 16px 6px;color:var(--secondary);font-weight:600}
.sect{margin:0}
.sect .gh + .grp{margin:0}
.chip{display:inline-block;background:var(--bg);color:var(--secondary);padding:1px 8px;border-radius:999px;font-weight:600;margin-top:3px}
.ch{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--secondary)}
.row{border:0;background:transparent;font:inherit;color:var(--label);text-align:left;cursor:pointer;width:100%;min-height:44px;-webkit-tap-highlight-color:transparent;transition:background-color 160ms cubic-bezier(.23,1,.32,1)}
.row:active{background:var(--bg)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ico{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- A: Soft glyphs ---------- */
.va .grp{padding:8px;display:flex;flex-direction:column;gap:6px}
.va .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"g t v a";align-items:center;gap:0 12px;padding:8px 10px;border-radius:18px}
.va .blob{grid-area:g;position:relative;width:2.2rem;height:2rem;flex:none}
.va .blob svg.b{position:absolute;inset:0;width:100%;height:100%;fill:var(--tint)}
.va .blob svg.ico{position:absolute;left:50%;top:50%;width:1.1rem;height:1.1rem;margin:-.55rem 0 0 -.55rem;color:var(--accent)}
.va .tx{grid-area:t;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.va .tx b{font-weight:600}
.va .tx .s{color:var(--secondary)}
.va .vl{grid-area:v;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.va .vl .n{font-family:var(--display-font);font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:600;font-variant-numeric:tabular-nums}
.va .vl .p{color:var(--secondary);font-weight:600}
.va .vl .u{color:var(--secondary)}
.va .ac{grid-area:a}
.va .see .tx b{color:var(--accent)}
html.larger .va .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"g t a" "g v a";gap:0 12px}
html.larger .va .vl{align-items:flex-start;text-align:left}
.tw{--tint:color-mix(in srgb,var(--warm) var(--mw,40%),var(--card))}
.tc{--tint:color-mix(in srgb,var(--char) var(--mc,50%),var(--card))}
.th{--tint:color-mix(in srgb,var(--char) 30%,var(--card))}
.ta{--tint:var(--accent-soft)}

/* ---------- B: Menu leaders ---------- */
.vb .grp{padding:14px 16px 8px}
.vb .grp > h3{margin:0 0 4px}
.vb .row{display:block;padding:8px 6px;margin:0 -6px;width:calc(100% + 12px);border-radius:12px}
.vb .l1{display:flex;align-items:baseline}
.vb .nm{font-weight:600;min-width:0}
.vb .lead{flex:1 1 1.5rem;min-width:1rem;height:0;margin:0 .5rem;border-bottom:2px dotted color-mix(in srgb,var(--label) 50%,transparent);position:relative;top:-.25em}
.vb .vv{font-family:var(--display-font);font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.vb .ch{align-self:center;margin-left:6px;width:14px;height:14px}
.vb .l2{color:var(--secondary);margin-top:1px}
.vb .dh{font-family:var(--display-font);font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:500;color:var(--secondary);margin:0;padding-top:10px}
.vb .dg + .dg{border-top:1px solid var(--sep);margin-top:8px}
.vb .see .nm{color:var(--accent)}
html.larger .vb .lead{display:none}
html.larger .vb .l1{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n c" "v c";align-items:center}
html.larger .vb .nm{grid-area:n}
html.larger .vb .vv{grid-area:v;text-align:left}
html.larger .vb .ch{grid-area:c}

/* ---------- C: Timeline ---------- */
.vc .tl{position:relative;padding:4px 0}
.vc .rail{position:absolute;left:22px;top:18px;bottom:18px;width:2px;margin-left:-1px;border-radius:1px;background:var(--sep-strong)}
.vc .row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"d d d" "t v a";align-items:center;gap:0 12px;padding:8px 14px 8px 46px;border-radius:14px}
.vc .row .d{grid-area:d;color:var(--secondary);font-weight:700}
.vc .row .d.now{color:var(--accent)}
.vc .tx{grid-area:t;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.vc .tx b{font-weight:600}
.vc .tx .s{color:var(--secondary)}
.vc .vl{grid-area:v;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.vc .vl .n{font-family:var(--display-font);font-variation-settings:"SOFT" 100,"WONK" 0;font-optical-sizing:auto;font-weight:600;font-variant-numeric:tabular-nums}
.vc .vl .u{color:var(--secondary)}
.vc .ac{grid-area:a}
.vc .node{position:absolute;left:22px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);top:calc(8px + .65rem)}
.vc .row.lab .node{top:calc(8px + 1.0588rem + .65rem)}
.vc .node.s{width:8px;height:8px}
.vc .node.m{width:12px;height:12px}
.vc .node.l{width:16px;height:16px}
.vc .node.w{width:14px;height:14px}
.vc .node.hl{background:var(--char);box-shadow:inset 0 0 0 2px var(--char-edge)}
.vc .row.more,html.larger .vc .row.more{display:grid;grid-template-areas:none;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 12px;padding:8px 14px 8px 46px;border-radius:14px}
.vc .more b,.vc .more .ac{grid-area:auto}
.vc .more b{color:var(--accent);font-weight:600}
html.larger .vc .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d d" "t a" "v a"}
html.larger .vc .vl{align-items:flex-start;text-align:left}
html.larger .vc .row .d{margin-bottom:0}
</style>
</head>
<body>
<div class="page">
  <header class="page-h">
    <h1>List options</h1>
    <p>Pick one. It becomes the list style across the app.</p>
  </header>
  <div class="controls"><button class="tog" id="big" type="button" aria-pressed="false">Larger text</button></div>
  <div class="cols">
    <section class="opt" aria-labelledby="ta"><h2 id="ta">A: Soft glyphs</h2><div id="a-light"></div><div id="a-dark"></div></section>
    <section class="opt" aria-labelledby="tb"><h2 id="tb">B: Menu leaders</h2><div id="b-light"></div><div id="b-dark"></div></section>
    <section class="opt" aria-labelledby="tc"><h2 id="tc">C: Timeline</h2><div id="c-light"></div><div id="c-dark"></div></section>
  </div>
</div>

<script>
/* ---------- Icons (drawn, one stroke weight, from index.html) ---------- */
const P = {
  basket:'M4 9h16l-1.5 9.5a1.5 1.5 0 0 1-1.5 1.3H7a1.5 1.5 0 0 1-1.5-1.3zM8.5 9l3.5-5 3.5 5',
  cup:'M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 9.5h1.5a2 2 0 0 1 0 4H16M8 4v1.5M11 4v1.5',
  car:'M4 15v-3l2-5h12l2 5v3zM4 15v2.5M20 15v2.5M7.5 12h.01M16.5 12h.01',
  dumbbell:'M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11',
  feet:'M8 4c2 0 3 2 3 4.5S10 12 8 12 5 10.5 5 8s1-4 3-4zM7 15.5h4M16 8c2 0 3 2 3 4.5S18 16 16 16s-3-1-3-3.5S14 8 16 8zM15 19.5h3.5',
  heart:'M12 20s-7.5-4.5-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.5-7.5 10-7.5 10z',
  bank:'M3 9.5L12 4l9 5.5zM5.5 12v5M10 12v5M14 12v5M18.5 12v5M3.5 19.5h17',
  bell:'M6 17V11a6 6 0 0 1 12 0v6l1.5 2H4.5zM10 21h4',
  chat:'M5 4.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4.2 3.3V17.5H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z',
  list:'M4 7h16M4 12h16M4 17h10',
  trophy:'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5.5a2.5 2.5 0 0 0 2.7 3.5M16 6h2.5a2.5 2.5 0 0 1-2.7 3.5M12 13v4M9 20h6'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const chev = '<svg class="ch" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
// The mochi body silhouette from charFace, no face. Tight viewBox around the shape.
const BLOB = '<svg class="b" viewBox="1.5 6 51 41" aria-hidden="true"><path d="M27 7 C41 7 50.5 17.5 51.5 30 C52.3 40 46 46 27 46 C8 46 1.7 40 2.5 30 C3.5 17.5 13 7 27 7 Z"/></svg>';

/* ---------- Data (same in every direction) ---------- */
const chipP = '<span class="chip t-cap">Pending</span>', chipH = '<span class="chip t-cap">From Apple Health</span>';
const TX = [
  {t:'Safeway', cat:'Groceries', v:'$64.20', d:'Today', lab:'Today', pend:1, icon:'basket', tint:'tw', sz:'l'},
  {t:'Tim Hortons', cat:'Coffee', v:'$4.85', d:'Today', lab:'', icon:'cup', tint:'tc', sz:'s'},
  {t:'Uber', cat:'Transport', v:'$18.40', d:'Yesterday', lab:'Yesterday', icon:'car', tint:'ta', sz:'m'},
  {t:'Evolve Fitness', cat:'Gym and fitness', v:'$59.00', d:'1 Nov', lab:'Sun 1 Nov', icon:'dumbbell', tint:'ta', sz:'l'}
];
const WK = [
  {day:'Fri', lab:'Fri 6', t:'Upper B', min:'48 min', kcal:'290 kcal', icon:'dumbbell', tint:'ta'},
  {day:'Thu', lab:'Thu 5', t:'Morning run', min:'32 min', kcal:'310 kcal', health:1, icon:'feet', tint:'th'},
  {day:'Wed', lab:'Wed 4', t:'Lower A', min:'52 min', kcal:'340 kcal', icon:'dumbbell', tint:'ta'},
  {day:'Tue', lab:'Tue 3', t:'Upper A', min:'50 min', icon:'dumbbell', tint:'ta'}
];
const PR = [
  {t:'Bench press', v:'70 kg', r:'for 8 reps', d:'Tue 3 Nov'},
  {t:'Back squat', v:'110 kg', r:'for 5 reps', d:'Wed 4 Nov'},
  {t:'Deadlift', v:'140 kg', r:'for 3 reps', d:'Sun 1 Nov'}
];
const ST = [
  {t:'AI and assistants', v:'2 of 3 shared', icon:'chat', tint:'th'},
  {t:'Notifications', v:'On', icon:'bell', tint:'tw'},
  {t:'Apple Health', v:'Synced 8 min ago', icon:'heart', tint:'th'},
  {t:'TD Bank', v:'Synced 2 h ago', icon:'bank', tint:'ta'}
];
const LISTS = [
  {id:'tx', title:'Recent transactions'},
  {id:'wk', title:"This week's workouts", more:'See all workouts'},
  {id:'pr', title:'Personal records', more:'See all records'},
  {id:'st', title:'Settings'}
];
const aria = {
  tx: x => `${x.t}, ${x.v}, ${x.cat}, ${x.d === '1 Nov' ? '1 November' : x.d.toLowerCase()}${x.pend ? ', pending' : ''}`,
  wk: x => `${x.t}, ${{Fri:'Friday',Thu:'Thursday',Wed:'Wednesday',Tue:'Tuesday'}[x.day]}, ${x.min}${x.kcal ? ', ' + x.kcal : ''}${x.health ? ', from Apple Health' : ''}`,
  pr: x => `${x.t}, ${x.v} ${x.r}, ${x.d}`,
  st: x => `${x.t}, ${x.v}`
};
const rows = id => ({tx:TX, wk:WK, pr:PR, st:ST})[id];
const btn = (cls, label, inner) => `<button type="button" class="row ${cls}" aria-label="${label}">${inner}</button>`;

/* ---------- A: Soft glyphs ---------- */
function rowA(id, x) {
  const sub = {tx:`${x.cat} · ${x.d}`, wk:x.day, pr:x.d, st:''}[id];
  const chips = id === 'tx' ? (x.pend ? chipP : '') : id === 'wk' ? (x.health ? chipH : '') : '';
  const val = {tx:`<span class="n t-head">${x.v}</span>`,
    wk:`<span class="n t-head">${x.min}</span>${x.kcal ? `<span class="u t-foot num">${x.kcal}</span>` : ''}`,
    pr:`<span class="n t-head">${x.v}</span><span class="u t-foot">${x.r}</span>`,
    st:`<span class="p t-sub sec">${x.v}</span>`}[id];
  const icon = id === 'pr' ? 'trophy' : x.icon;
  const tint = id === 'pr' ? 'ta' : x.tint;
  return btn('', aria[id](x), `<span class="blob ${tint}">${BLOB}${ico(icon)}</span>
    <span class="tx"><b class="t-body">${x.t}</b>${sub ? `<span class="s t-foot">${sub}</span>` : ''}${chips}</span>
    <span class="vl">${val}</span><span class="ac">${chev}</span>`);
}
function moreA(label, icon) {
  return btn('see', label, `<span class="blob ta">${BLOB}${ico('list')}</span><span class="tx"><b class="t-body">${label}</b></span><span></span><span class="ac">${chev}</span>`);
}
function listA(l) {
  const body = rows(l.id).map(x => rowA(l.id, x)).join('') + (l.more ? moreA(l.more) : '');
  return `<section class="sect" aria-label="${l.title}"><h3 class="gh t-sub">${l.title}</h3><div class="grp">${body}</div></section>`;
}

/* ---------- B: Menu leaders ---------- */
function rowB(id, x) {
  const l2 = {tx:`${x.cat}`, wk:`${x.day}${x.kcal ? ' · ' + x.kcal : ''}`, pr:x.d, st:''}[id];
  const chips = id === 'tx' ? (x.pend ? chipP : '') : id === 'wk' ? (x.health ? chipH : '') : '';
  const v = {tx:x.v, wk:x.min, pr:`${x.v} ${x.r}`, st:x.v}[id];
  return btn('', aria[id](x), `<span class="l1"><span class="nm t-body">${x.t}</span><span class="lead" aria-hidden="true"></span><span class="vv t-body">${v}</span>${chev}</span>${(l2 || chips) ? `<span class="l2 t-foot" style="display:block">${l2}${l2 && chips ? ' ' : ''}${chips}</span>` : ''}`);
}
function listB(l) {
  let body;
  if (l.id === 'tx') {
    const groups = [];
    TX.forEach(x => { const g = groups.find(g => g.d === x.d); g ? g.items.push(x) : groups.push({d:x.d, items:[x]}); });
    body = groups.map(g => `<div class="dg"><p class="dh t-sub">${g.d}</p>${g.items.map(x => rowB('tx', x)).join('')}</div>`).join('');
  } else body = `<div class="dg">${rows(l.id).map(x => rowB(l.id, x)).join('')}</div>`;
  const more = l.more ? `<div class="dg">${btn('see', l.more, `<span class="l1"><span class="nm t-body">${l.more}</span><span class="lead" aria-hidden="true" style="border:0"></span>${chev}</span>`)}</div>` : '';
  return `<section class="sect" aria-label="${l.title}"><div class="grp"><h3 class="display t-head">${l.title}</h3>${body}${more}</div></section>`;
}

/* ---------- C: Timeline (dated lists), A for undated ---------- */
function rowC(id, x) {
  const isTx = id === 'tx';
  const lab = isTx ? x.lab : x.lab;
  const node = isTx ? `<i class="node ${x.sz}" aria-hidden="true"></i>` : `<i class="node w${x.health ? ' hl' : ''}" aria-hidden="true"></i>`;
  const sub = isTx ? x.cat : '';
  const chips = isTx ? (x.pend ? chipP : '') : (x.health ? chipH : '');
  const val = isTx ? `<span class="n t-head">${x.v}</span>` : `<span class="n t-head">${x.min}</span>${x.kcal ? `<span class="u t-foot num">${x.kcal}</span>` : ''}`;
  return btn(lab ? 'lab' : '', aria[id](x), `${node}${lab ? `<span class="d t-foot${lab === 'Today' ? ' now' : ''}">${lab}</span>` : ''}
    <span class="tx"><b class="t-body">${x.t}</b>${sub ? `<span class="s t-foot">${sub}</span>` : ''}${chips}</span><span class="vl">${val}</span><span class="ac">${chev}</span>`);
}
function listC(l) {
  if (l.id === 'pr' || l.id === 'st') return `<div class="va">${listA(l)}</div>`;
  const body = `<div class="tl"><span class="rail" aria-hidden="true"></span>${rows(l.id).map(x => rowC(l.id, x)).join('')}</div>`;
  const more = l.more ? btn('more', l.more, `<b class="t-body">${l.more}</b><span class="ac">${chev}</span>`).replace('class="row more"', 'class="row more"') : '';
  return `<div class="vc"><section class="sect" aria-label="${l.title}"><h3 class="gh t-sub">${l.title}</h3><div class="grp" style="padding:8px">${body}${more}</div></section></div>`;
}

const R = {a:{cls:'va', fn:listA}, b:{cls:'vb', fn:listB}, c:{cls:'', fn:listC}};
for (const k of ['a', 'b', 'c'])
  for (const m of ['light', 'dark'])
    document.getElementById(`${k}-${m}`).innerHTML = `<div class="panel dir-friendly ${m} ${R[k].cls}">${LISTS.map(R[k].fn).join('')}</div>`;

const big = document.getElementById('big');
big.addEventListener('click', () => {
  const on = document.documentElement.classList.toggle('larger');
  big.setAttribute('aria-pressed', String(on));
});
</script>
</body>
</html>

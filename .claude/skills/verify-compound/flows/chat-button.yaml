appId: com.pratham124.compound
---
# Mirrors features/chat-button.md. Starts signed in on Today.
# The button is proven by screenshots only: on Android its accessibility node sits at the untransformed bounds with no
# label, so Maestro cannot select it (see Gotchas in the feature file).
- runFlow: _park-tools.yaml

# Shown on Today, Train, Money, Trends. The button fades in over 300 ms, so let it settle before each capture.
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-today
- tapOn: "Train"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-train
- tapOn: "Money"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-money
- tapOn: "Trends"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-trends

# Hidden on Chat and Settings.
- tapOn: "Chat"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-hidden-chat
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-hidden-settings
- back
- runFlow: _dismiss-dev-menu.yaml
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: chat-button-back-on-today

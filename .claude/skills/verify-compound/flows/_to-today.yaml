appId: com.pratham124.compound
---
# Gets back to Today between features on one Launch: dev menu closed, then back out of any sub-screen.
# If back never reaches Today (a route opened by link can leave only the tab-less stack), restart the app.
- runFlow: _dismiss-dev-menu.yaml
- repeat:
    while:
      notVisible: "Today|Use an email code instead"
    times: 6
    commands:
      - back
- runFlow:
    when:
      notVisible: "Today|Use an email code instead"
    commands:
      - stopApp
      - launchApp
      - runFlow: _dismiss-dev-menu.yaml
      - extendedWaitUntil:
          visible: "Today|Use an email code instead"
          timeout: 90000

\* CLAIM without its where clause: every change replaces the stored one.
\* expect: NewestWins
SPECIFICATION Spec
CONSTANTS
    ClaimIsConditional = FALSE
    ClaimLocks = TRUE
    DeleteBeforeInsert = TRUE
    SetIdIsPrimaryKey = TRUE
    KeepRowsUntilAnswered = TRUE
    MaxSends = 4
INVARIANTS NoDuplicateSet StoredIsWinner NewestWins NothingLost QuiescentSynced

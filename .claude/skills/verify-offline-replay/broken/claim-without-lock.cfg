\* The version read and written in two steps, without holding the row lock (the read-then-write design).
\* expect: NewestWins
SPECIFICATION Spec
CONSTANTS
    ClaimIsConditional = TRUE
    ClaimLocks = FALSE
    DeleteBeforeInsert = TRUE
    SetIdIsPrimaryKey = TRUE
    KeepRowsUntilAnswered = TRUE
    MaxSends = 4
INVARIANTS NoDuplicateSet StoredIsWinner NewestWins NothingLost QuiescentSynced

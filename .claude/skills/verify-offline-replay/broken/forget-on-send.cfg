\* The runner drops rows once sent, before the server answers.
\* expect: NothingLost
SPECIFICATION Spec
CONSTANTS
    ClaimIsConditional = TRUE
    ClaimLocks = TRUE
    DeleteBeforeInsert = TRUE
    SetIdIsPrimaryKey = TRUE
    KeepRowsUntilAnswered = FALSE
    MaxSends = 4
INVARIANTS NoDuplicateSet StoredIsWinner NewestWins NothingLost QuiescentSynced

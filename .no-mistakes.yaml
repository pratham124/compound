# no-mistakes config. commands, gates, test.instructions, document.instructions, auto_fix.gates
# and pr are read only from the default branch, so they take effect once this file is on main.

commands:
  # Run worktrees start with tracked files only; this installs node_modules once, before lint.
  prepare: pnpm install --frozen-lockfile --prefer-offline
  # The exact command CI runs, so the pipeline and CI agree on lint.
  lint: pnpm lint

pr:
  # Matt Pocock's PR format (Summary, Evidence, Merge danger) on top; no-mistakes' own
  # Risk, Testing and Pipeline evidence folded into one closed block underneath.
  template: .github/pull_request_template.md
  appendix: collapsed
  # The Summary already says what and why; intent still feeds the review step.
  publish_intent: false

review:
  # Checklist triggered by the diff: each entry fires only when a changed file matches its path,
  # and each names the incident or mechanism behind it. Add an entry when something slips past
  # review; delete one when a test or gate starts catching it.
  path_instructions:
    - path: apps/server/migrations/**
      instructions: |
        - migrate.ts applies each file once by name, so an edit to a migration already on main never
          runs anywhere it was applied. Changes to shipped schema go in a new numbered file.
        - A table holding one person's data has a user_id column, row-level security enabled and
          forced, a policy `to compound_api` with `user_id = app_user_id()` in both `using` and
          `with check`, and grants to compound_api only. rowLevelSecurity.test.ts catches a missing
          enable/force but not a policy that is too wide (`using (true)`, the wrong role, or a
          missing `with check`).
        - compound_auth reaches users and accounts only. Flag any new grant to it.
    - path: apps/server/src/**
      instructions: |
        - A query on a per-person table runs inside withUser (profileStore.ts), never on the owner
          pool, which bypasses the policies or sees nothing depending on whether the owner is a superuser.
        - The `query` function withUser passes in must not be stored or used after the callback returns.
    - path: apps/mobile/jest.*
      instructions: |
        - On Linux, pnpm puts peer dependency names into package folder names
          (react-native-reanimated@4.7.1_react-native-worklets@...), while Windows shortens them to a
          hash. Resolver logic that matches a substring of a file path passes locally and breaks CI.
          Work out the package from the folder after the last node_modules instead.
        - A local Windows test run is not evidence for a resolver change; ask for a Linux run (CI or
          a node container).
    - path: pnpm-lock.yaml
      instructions: |
        - A local Windows test run is not evidence for a dependency change: pnpm's folder names
          differ on Linux, which has broken the mobile Jest resolver before. Ask for a Linux run.

document:
  instructions: |
    .claude/skills/verify-*/features/ owns how each user-facing feature is verified. When the
    change adds or alters a user-facing feature, create or update that feature's file there.
    Match the existing feature files' format, which is pstack's feature map: an H1 with the
    feature name, then four H2 sections: Sub-features, How to get to it (user POV),
    Driving it with <the verify skill's harness>, Gotchas. Add a new file to the map's
    README.md index too.
    Each .claude/skills/verify-*/depends.txt lists the files that skill's SKILL.md and scripts
    depend on. When the change touches a path it lists, also update that skill's SKILL.md and
    scripts/ (ports, services, env, start commands, labels the recipes use), not only the
    feature files. If the change adds or upgrades a native module or an app.json plugin, don't
    try to rebuild the development client: say in your report that
    .claude/skills/verify-compound/scripts/build-dev-client.sh must be rerun.
    Do not edit formal verification models or any covers.txt; flag drift instead.
    docs/prd/ is the product spec. README.md is the introduction.
    docs/architecture/*.svg are archify exports of the sources in docs/diagrams/ (see the
    "Architecture diagrams" section of CLAUDE.md). If the change alters what one of those
    diagrams shows and the diagram wasn't updated, raise a finding naming the diagram.
    Never hand-edit the SVGs.

test:
  instructions: |
    1. If every changed file is docs or tooling (under docs/, .claude/, .github/, spike/, or a
       .md file), there is nothing to drive: report that and pass.
    2. If .claude/skills/verify-compound/SKILL.md exists, follow its Launch, Doctor, Drive,
       Evidence and Cleanup sections for each feature the change touches (use the run's
       verification plan if one was given). Capture screenshots or recordings as evidence.
    3. If step 2 did not apply, run the repo's tests for the changed area and say live driving
       isn't set up yet (the verify skill arrives at the end of M1). The server tests need the
       local stack, which every worktree shares. Run `[ -f .env ] || cp .env.example .env`. If
       `docker compose ps --status running -q` prints nothing, run `pnpm stack:up` before the
       tests and `pnpm stack:down` after. If it prints something, the stack was already running:
       use it and leave it running, except that if the change touches compose.yaml or
       infra/local/, run `pnpm stack:up` anyway so Compose recreates the changed services.
  evidence:
    store_in_repo: false # keep binary evidence out of git history
    attach_media: true
    compact: true

gates:
  # Feature map and formal-check skills must change with the code they describe.
  - name: verification-sync
    after: document
    command: node scripts/verification/check-sync.mjs
  # Runs each formal check whose covered code changed (needs test's code to be final).
  - name: formal-checks
    after: test
    command: node scripts/verification/run-formal.mjs

auto_fix:
  gates:
    # 0 on purpose: a failing gate may be a real bug, so it parks for Pratham instead of
    # letting an agent edit the check until it passes.
    verification-sync: 0
    formal-checks: 0

name: compound

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8.1.11-alpine
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "127.0.0.1:${SQS_PORT:-9324}:9324"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9324/?Action=ListQueues"]
      interval: 2s
      timeout: 3s
      retries: 15

  ticker:
    image: node:24.22.3-alpine
    working_dir: /app
    command: ["node", "ticker.ts"]
    environment:
      SQS_ENDPOINT: http://sqs:9324
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-10}
    volumes:
      - ./infra/local/ticker.ts:/app/ticker.ts:ro
      - ./infra/local/tick-body.ts:/app/tick-body.ts:ro
      - ./infra/local/tick-interval.ts:/app/tick-interval.ts:ro
    depends_on:
      sqs:
        condition: service_healthy

volumes:
  postgres-data:
